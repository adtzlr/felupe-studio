name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # FElupe version the golden tests and the browser runtime are pinned to
  FELUPE_VERSION: "12.1.0"

jobs:
  app:
    name: App (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Generated types are up to date
        run: npm run schema:types && git diff --exit-code src/core/commands.ts src/core/resolved.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test,mcp]" "felupe==${FELUPE_VERSION}"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not golden"
      - name: Golden tests
        run: pytest -m golden -v

  package:
    name: Package (wheel outside of a clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # the samples and the documents of the MCP server are in the wheel (#275)
      - name: The wheel in a fresh environment
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install "$(ls dist/*.whl)[mcp]" "felupe==${FELUPE_VERSION}"
          cd /tmp && /tmp/wheel/bin/python "$GITHUB_WORKSPACE/tests/check_wheel.py"
