name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # FElupe version the golden tests and the browser runtime are pinned to
  FELUPE_VERSION: "12.1.1"

jobs:
  app:
    name: App (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Generated types are up to date
        run: npm run schema:types && git diff --exit-code src/core/commands.ts src/core/resolved.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test,mcp,serve]" "felupe==${FELUPE_VERSION}"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not golden"
      - name: Golden tests
        run: pytest -m golden -v

  package:
    name: Package (wheel outside of a clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the built app is part of the wheel, for felupe-studio serve (#240)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run build
        working-directory: app
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
        env:
          FELUPE_STUDIO_REQUIRE_APP: "1"
      - run: twine check --strict dist/*
      # the samples and the documents of the MCP server are in the wheel (#275),
      # and the app of felupe-studio serve (#240)
      - name: The wheel in a fresh environment
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install "$(ls dist/*.whl)[mcp,serve]" "felupe==${FELUPE_VERSION}"
          cd /tmp && /tmp/wheel/bin/python "$GITHUB_WORKSPACE/tests/check_wheel.py"

  local:
    name: Local runtime and agent bridge (app in a browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run build
        working-directory: app
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[test,serve,mcp]" "felupe==${FELUPE_VERSION}" playwright
      - run: playwright install --with-deps chromium
      # a sample opened from felupe-studio serve, solved with CPython (#240), and an
      # agent on the open app (#258)
      - run: pytest -m e2e tests/e2e -v

  brand:
    name: Example brand (build, browser without internet, wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # the build of a brand (ADR 0020), like brands/github-actions.yml does with a
      # release: brands/example with its samples and a self-hosted Pyodide (#321)
      - run: npm ci && npm run build
        working-directory: app
        env:
          BRAND_DIR: ${{ github.workspace }}/brands/example
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[test,serve]" "felupe==${FELUPE_VERSION}" playwright build
      - run: playwright install --with-deps chromium
      # its name, its manifest and its samples, solved without internet
      - run: pytest -m e2e tests/e2e/test_example_brand.py -v
        env:
          BRAND_DIST: app/dist
      # the wheel of the brand: its app and its samples for felupe-studio serve
      - name: The wheel of the brand
        run: |
          python -m build --wheel
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install "$(ls dist/*.whl)[mcp,serve]" "felupe==${FELUPE_VERSION}"
          cd /tmp && /tmp/wheel/bin/python "$GITHUB_WORKSPACE/tests/check_wheel.py" "$GITHUB_WORKSPACE/brands/example"
        env:
          FELUPE_STUDIO_REQUIRE_APP: "1"
