name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # FElupe version the golden tests and the browser runtime are pinned to
  FELUPE_VERSION: "12.0.0"

jobs:
  app:
    name: App (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Generated types are up to date
        run: npm run schema:types && git diff --exit-code src/core/commands.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test]" "felupe==${FELUPE_VERSION}"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not golden"
      - name: Golden tests
        run: pytest -m golden -v
