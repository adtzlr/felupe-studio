[build-system]
# the README of PyPI with absolute links (#275)
requires = ["hatchling", "hatch-fancy-pypi-readme>=25"]
build-backend = "hatchling.build"

[project]
name = "felupe-studio"
description = "The Python side of FElupe Studio: the commands of a model, its FElupe script, its results and an MCP server for AI agents"
keywords = ["felupe", "finite-element-method", "hyperelasticity", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Andreas Dutzler" }]
requires-python = ">=3.11"
dynamic = ["version", "readme"]
dependencies = ["felupe>=12.1.2", "meshio", "tensortrax>=0.30.0", "jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest", "ruff"]
# the MCP server for AI agents (#239)
mcp = ["mcp>=2.3"]
# the app with a local Python runtime: felupe-studio serve (#240)
serve = ["starlette>=0.40", "uvicorn>=0.30", "websockets>=13"]
# PARDISO of Intel oneMKL as the linear solver of a job (#308), in Python on the
# computer: Intel oneMKL has wheels for x86-64 (Linux, Windows), not for Apple silicon
pardiso = ["pypardiso"]

[project.scripts]
felupe-studio = "felupe_studio.cli:main"
felupe-studio-mcp = "felupe_studio.mcp:main"

[project.urls]
Homepage = "https://github.com/adtzlr/felupe-studio"
App = "https://adtzlr.github.io/felupe-studio/"
Documentation = "https://github.com/adtzlr/felupe-studio/blob/main/docs/guide.md"
Changelog = "https://github.com/adtzlr/felupe-studio/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "python/felupe_studio/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["python/felupe_studio"]

# the built app for felupe-studio serve (#240) and the samples of the build (#350),
# see hatch_build.py
[tool.hatch.build.targets.wheel.hooks.custom]

# the documents of the MCP server, outside of a clone (#275)
[tool.hatch.build.targets.wheel.force-include]
"docs/guide.md" = "felupe_studio/data/docs/guide.md"
"docs/commands.md" = "felupe_studio/data/docs/commands.md"
"docs/reference.md" = "felupe_studio/data/docs/reference.md"

[tool.hatch.build.targets.sdist]
include = [
  "python/felupe_studio",
  "app/samples",
  "docs/guide.md",
  "docs/commands.md",
  "docs/reference.md",
  "/README.md",
  "/CHANGELOG.md",
  "/hatch_build.py",
]
# the built app with its samples, if there is one (ignored by git), without the
# wheels of Pyodide: the wheel of the sdist gets it (#240, #350)
artifacts = ["/app/dist/*.*", "/app/dist/assets", "/app/dist/samples"]

# the README on PyPI: the relative links and pictures of the repository point to
# GitHub (#275)
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[(.*?)\]\((?!https?://)(.*?)\)'
replacement = '![\1](https://raw.githubusercontent.com/adtzlr/felupe-studio/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)(.*?)\)'
replacement = '](https://github.com/adtzlr/felupe-studio/blob/main/\1)'

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901"]

# the complexity of a function (#313): a function above it is split, or explains
# with a noqa why it is not, e.g. the tools of an MCP server as nested functions
[tool.ruff.lint.mccabe]
max-complexity = 15
